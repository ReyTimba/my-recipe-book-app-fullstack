services:
  - type: web
    name: recetario-api
    runtime: node
    repo: https://github.com/ReyTimba/my-recipe-book-app-fullstack
    branch: main
    buildCommand: cd backend && npm ci && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recetario-db
          property: connectionString
      - key: PORT
        value: "3001"

databases:
  - name: recetario-db
    databaseName: recetario
    user: recetario
    plan: free

      - 'npm run build: debe aprobar.'
    riesgos_conocidos:
      - '55 recetas son muchos datos iniciales; puede ralentizar la carga inicial.'
      - 'Algunas recetas tienen preparación no visible ("no visible") o ingredientes incompletos; deben representarse fielmente, sin inventar.'
      - '3 dudas marcadas (Goulash roux, Scrippelle agua, Sarde in saor cebolla) y 2 continuaciones ausentes (albóndigas, gravlax).'
    condiciones_de_parada:
      - 'Si una receta no puede representarse fielmente con el modelo v2 actual, detenerse y documentar el caso.'
      - 'No modificar el modelo de datos para acomodar una receta; documentar la limitación.'
      - 'No eliminar, modificar ni ocultar los datos de ejemplo originales sin preservar la funcionalidad de ejemplo.'
      - 'No escribir fuera de las rutas autorizadas.'
    superficie_requerida:
      - 'Navegador para el recorrido interactivo final (anfitrión).'
      - 'Consola/terminal para pruebas estáticas (Ejecutor o anfitrión).'
    prueba_previa_sin_cambios:

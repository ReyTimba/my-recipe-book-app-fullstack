      - 'No modificar el modelo de datos (tipos, interfaces, validación, migración, storage).'
      - 'No modificar recetas_extraidas.md.'
      - 'No modificar tests existentes (solo añadir si es necesario).'
      - 'No hacer commit.'

  cambios_solicitados:
    - '1. Leer recetas_extraidas.md completa y clasificar las 55 recetas según los tipos del modelo v2 (simples, compuestas, componentes, etc.).'
    - '2. Crear un archivo src/domain/recetas-cargadas.ts que exporte una función obtenerRecetasCargadas(): Recipe[] con las 55 recetas convertidas al formato Recipe v2.'
    - '3. Cada receta debe incluir: nombre, descripción (si existe), ingredientes con cantidades estructuradas, pasos con estado, fuente (imagen JPG), rendimiento cuando sea explícito (porciones, unidades, etc.), tiempos cuando estén presentes, y un array de incertidumbres para dudas o datos faltantes.'
    - '4. Para recetas con preparación no visible: marcar preparationStatus: "absent" y documentar en incertidumbres.'
    - '5. Para recetas incompletas (albóndigas, gravlax): marcar preparationStatus: "incomplete" y documentar en incertidumbres.'
    - '6. Para las 3 dudas conocidas (Goulash roux, Scrippelle agua, Sarde in saor cebolla): añadir incertidumbres con state "uncertain" y la nota de la duda.'
    - '7. Modificar src/domain/recipe.ts para que exampleRecipes() (o una nueva función de inicialización) devuelva las 55 recetas cargadas en lugar de las 2 de ejemplo actuales. Las recetas de ejemplo actuales pueden conservarse como comentario o eliminarse.'
    - '8. Verificar que la aplicación carga y muestra correctamente las recetas: al abrir la app sin datos previos deben aparecer las 55 recetas.'
    - '9. Asegurar que búsqueda, filtros, favoritos, edición, creación, eliminación, exportación e importación siguen funcionando con las recetas cargadas.'
    - '10. No incluir las recetas de ejemplo actuales (tortilla, lentejas) a menos que también estén en recetas_extraidas.md.'

  comprobacion_tecnica_esperada:
    obligatorias:
      - 'npm test: 5 archivos y ≥33/33 pruebas aprobadas (las pruebas existentes no deben fallar).'
      - 'npm run typecheck: satisfactorio.'
      - 'npm run build: producción generada sin errores.'
      - 'Las 55 recetas están presentes al cargar la app sin datos previos (verificado en navegador).'
      - 'Cada receta tiene id único, nombre no vacío y al menos ingredientes o pasos (o indicación explícita de ausencia).'
      - 'Las fuentes de imagen se conservan como RecipeSource con kind "image".'
      - 'Las 3 dudas y 2 continuaciones ausentes están documentadas como incertidumbres en las recetas correspondientes.'
      - 'No se modificó el modelo Recipe, la migración ni el storage.'
      - 'recetas_extraidas.md conserva su huella original.'
    recomendadas:
      - 'Al menos una receta con secciones (Fresas con crema, Pastrami, etc.) se representa correctamente con sections[].'
      - 'Alguna receta compuesta (Titaina, Puerro compuesto) usa referencias a otras recetas si es necesario.'
      - 'Rendimiento explícito para recetas que lo indican (ej: "x3", "aprox. 500 ml", "1 kg").'
      - 'Conservar el texto original de ingredientes y pasos junto a la interpretación estructurada.'
    contrato_vivacidad:
      - 'Primera señal antes de 60 segundos.'
      - 'Un sondeo tras 60 segundos sin progreso.'
      - 'Una interrupción tras otros 60 segundos.'
      - 'Una sola recuperación después de reconstruir la bóveda.'

      - 'Verificar que recetas_extraidas.md está presente con su huella.'
    responsable_interaccion: 'Anfitrión (humano) para el recorrido en navegador.'
    condicion_salida:
      - 'Recorrido en navegador: abrir app, observar al menos 10 recetas listadas, abrir detalle de una receta compleja (ej: Fresas con crema o Lingote de chocolate), verificar que ingredientes y pasos son legibles.'
    acciones_prohibidas:
